services:
  - type: web
    name: sellingteen-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python render_start.py && gunicorn render_wsgi:application --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DEMO_MODE
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false
