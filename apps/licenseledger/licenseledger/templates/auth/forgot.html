{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block auth_content %}
<div class="card auth-card">
  <h1>Forgot your password?</h1>
  <p class="muted">Enter your account email. If an account exists, we will email you a link to choose a new password.
    The link works for 1 hour.</p>
  <form method="post" action="{{ url_for('auth.forgot_password') }}" class="stack-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" maxlength="254" required autofocus autocomplete="email">
    </div>
    <button class="btn btn-primary btn-block" type="submit">Send reset link</button>
  </form>
  <p><a href="{{ url_for('auth.login') }}">Back to log in</a></p>
</div>
{% endblock %}
