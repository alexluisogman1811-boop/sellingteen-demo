{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Error {{ code }}</h1>
  <p>{{ message }}</p>
  <p><a class="btn" href="{{ url_for('main.dashboard') }}">Back to dashboard</a></p>
</div>
{% endblock %}
{% block auth_content %}
<div class="card auth-card">
  <h1>Error {{ code }}</h1>
  <p>{{ message }}</p>
  <p><a class="btn" href="{{ url_for('auth.login') }}">Go to sign in</a></p>
</div>
{% endblock %}
