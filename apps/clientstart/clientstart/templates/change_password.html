{% extends "base.html" %}
{% from "macros.html" import csrf with context %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Change owner password</h1></div></div>
<form method="post" action="{{ url_for('auth.change_password') }}" class="card form narrow-form">
  {{ csrf() }}
  <label>Current password <input type="password" name="current" required autocomplete="current-password"></label>
  <label>New password <span class="hint">At least {{ min_length }} characters. Other signed-in browsers will be signed out.</span>
    <input type="password" name="password" required minlength="{{ min_length }}" autocomplete="new-password"></label>
  <label>Confirm new password <input type="password" name="confirm" required minlength="{{ min_length }}" autocomplete="new-password"></label>
  <button class="btn btn-primary" type="submit">Change password</button>
</form>
{% endblock %}
