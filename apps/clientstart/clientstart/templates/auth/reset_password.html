{% extends "auth_base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<h1>Choose a new password</h1>
<form method="post" action="{{ url_for('auth.reset_password', token=token) }}" class="form">
  {{ csrf() }}
  <label>New password <span class="hint">At least {{ min_length }} characters.</span>
    <input type="password" name="password" required minlength="{{ min_length }}" autocomplete="new-password" autofocus></label>
  <label>Confirm new password <input type="password" name="confirm" required minlength="{{ min_length }}" autocomplete="new-password"></label>
  <button class="btn btn-primary btn-block" type="submit">Save new password</button>
</form>
{% endblock %}
