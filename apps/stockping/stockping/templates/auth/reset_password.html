{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Choose a new password</h1>
  {% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('auth.reset_password', token=token) }}" class="form" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="f-password">New password (at least 8 characters)</label>
      <input id="f-password" name="password" type="password" required minlength="8" maxlength="200" autocomplete="new-password">
    </div>
    <div class="field">
      <label for="f-password2">New password again</label>
      <input id="f-password2" name="password2" type="password" required minlength="8" maxlength="200" autocomplete="new-password">
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Save new password</button>
    </div>
  </form>
</section>
{% endblock %}
