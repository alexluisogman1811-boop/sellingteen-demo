{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Forgot your password?</h1>
  <p>Enter the email you log in with. If an account exists, we will email you a link to choose a new password. The link works for 1 hour.</p>
  <form method="post" action="{{ url_for('auth.forgot_password') }}" class="form" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="f-email">Email</label>
      <input id="f-email" name="email" type="email" required autocomplete="email" maxlength="254">
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Send reset link</button>
    </div>
  </form>
  <p><a href="{{ url_for('auth.login') }}">Back to log in</a></p>
</section>
{% endblock %}
