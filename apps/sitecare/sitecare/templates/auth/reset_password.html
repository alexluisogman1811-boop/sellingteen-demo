{% extends "base.html" %}
{% from "_macros.html" import field_error %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Choose a new password</h1>
  <form method="post" class="stack" action="{{ url_for('auth.reset_password', token=token) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="f-np">New password</label>
    <input id="f-np" name="new_password" type="password" required minlength="10" maxlength="128" autocomplete="new-password">
    <p class="hint">At least 10 characters.</p>
    <label for="f-np2">New password again</label>
    <input id="f-np2" name="confirm_password" type="password" required maxlength="128" autocomplete="new-password">
    {{ field_error(errors, 'new_password') }}
    <button class="btn btn-primary" type="submit">Save new password</button>
  </form>
</section>
{% endblock %}
