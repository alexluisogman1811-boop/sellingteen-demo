{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1>Forgot your password?</h1>
  <p class="muted">Enter the email you signed up with. If it has an account, we will email you a link to choose a new password.</p>
  <form method="post" class="stack" action="{{ url_for('auth.forgot_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="f-email">Email</label>
    <input id="f-email" name="email" type="email" required maxlength="254" autocomplete="email" autofocus>
    <button class="btn btn-primary" type="submit">Send reset link</button>
  </form>
  <p class="hint"><a href="{{ url_for('auth.login') }}">Back to log in</a></p>
</section>
{% endblock %}
