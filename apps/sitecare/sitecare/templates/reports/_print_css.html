<style>
  :root { --ink: #1c2430; --muted: #5d6878; --line: #d9dee6; --accent: #2457c5; }
  * { box-sizing: border-box; }
  body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #fff; margin: 0; }
  .page { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
  header { border-bottom: 3px solid var(--accent); padding-bottom: 12px; margin-bottom: 20px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 24px 0 6px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 4px 16px; margin: 8px 0 0; }
  .totals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0; }
  .totals div { border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .totals strong { display: block; font-size: 22px; }
  table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  .nowrap { white-space: nowrap; }
  .prewrap { white-space: pre-wrap; }
  .badge { font-weight: 600; }
  .badge-danger { color: #b42318; }
  .empty { color: var(--muted); font-style: italic; }
  .notice { margin-top: 28px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #f6f8fb; font-size: 12px; }
  .toolbar { margin-bottom: 16px; }
  .toolbar button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
  .table-wrap { overflow-x: auto; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .highlights { margin: 0; padding-left: 18px; }
  .highlights li { margin: 2px 0; }
  .r-attention { border-left: 4px solid #b42318; padding: 4px 12px; background: #fdf3f2; border-radius: 6px; }
  .r-attention h2 { margin-top: 8px; }
  .site-head { border-top: 3px solid var(--accent); margin-top: 30px; padding-top: 10px; }
  .site-head h2 { font-size: 20px; margin: 0; }
  .r-section h2 { font-size: 16px; }
  .saved-note { font-size: 12px; color: var(--muted); }
  .res-issues_found { color: #9a5b00; font-weight: 600; }
  .res-failed { color: #b42318; font-weight: 600; }
  @media (max-width: 600px) {
    .totals { grid-template-columns: repeat(2, 1fr); }
    .page { padding: 16px 12px; }
    .table-stack thead { display: none; }
    .table-stack, .table-stack tbody, .table-stack tr, .table-stack td { display: block; width: 100%; }
    .table-stack tr { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin-bottom: 8px; }
    .table-stack td { border: 0; padding: 3px 0; display: flex; gap: 10px; }
    .table-stack td::before { content: attr(data-label); flex: 0 0 34%; color: var(--muted); font-size: 11px; text-transform: uppercase; }
    .table-stack td > * { min-width: 0; }
  }
  @media print {
    .toolbar { display: none; }
    .page { padding: 0; max-width: none; }
    tr { page-break-inside: avoid; }
    a { color: inherit; text-decoration: none; }
  }
</style>
