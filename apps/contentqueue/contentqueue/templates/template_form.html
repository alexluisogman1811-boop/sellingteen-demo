{% extends "base.html" %}
{% from "macros.html" import csrf %}
{% block title %}Edit template{% endblock %}
{% block content %}
<div class="page-head"><div><p class="crumbs"><a href="{{ url_for('library.templates') }}">Templates</a> /</p><h1>Edit template</h1></div></div>
<div class="narrow">
  <form method="post" class="card stack" novalidate>
    {{ csrf() }}
    {% include "_template_fields.html" %}
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn btn-ghost" href="{{ url_for('library.templates') }}">Cancel</a>
    </div>
  </form>
  <form method="post" action="{{ url_for('library.delete_template', item_id=item.id) }}" class="danger-inline"
        data-confirm="Delete this template?">
    {{ csrf() }}<button class="btn btn-danger btn-sm" type="submit">Delete template</button>
  </form>
</div>
{% endblock %}
