{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="empty-state error-page">
  <p class="error-code">{{ code }}</p>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for('leads.dashboard') if g.user else url_for('auth.login') }}">{{ 'Back to dashboard' if g.user else 'Go to login' }}</a>
</div>
{% endblock %}
