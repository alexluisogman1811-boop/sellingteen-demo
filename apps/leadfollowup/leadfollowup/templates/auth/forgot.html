{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Forgot your password?</h1>
  <p class="muted">Enter the email you signed up with. If an account exists, we'll email you a link to choose a new password.</p>
  <form method="post" action="{{ url_for('auth.forgot_password') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" autofocus>
    </div>
    <button type="submit" class="btn btn-primary btn-block" data-loading-text="Sending…">Send reset link</button>
  </form>
  <p class="auth-switch"><a href="{{ url_for('auth.login') }}">Back to log in</a></p>
</div>
{% endblock %}
