{% extends "base.html" %}
{% from "_macros.html" import csrf, errors as show_errors %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<div class="narrow">
  <h1>Choose a new password</h1>
  {{ show_errors(errors) }}
  <form method="post" action="{{ url_for('auth.reset_password', token=token) }}" class="stack card">
    {{ csrf() }}
    <div class="field"><label for="new_password">New password</label>
      <input id="new_password" name="new_password" type="password" required minlength="10" autocomplete="new-password">
      <div class="hint">At least 10 characters.</div></div>
    <div class="field"><label for="confirm_password">New password again</label>
      <input id="confirm_password" name="confirm_password" type="password" required autocomplete="new-password"></div>
    <button class="btn primary" type="submit">Save new password</button>
  </form>
</div>
{% endblock %}
