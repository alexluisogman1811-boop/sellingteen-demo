{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Forgot your password?</h1>
  <p>Enter your account email. If an account exists, we will email you a link to choose a new password. The link works for 1 hour.</p>
  <form method="post" action="{{ url_for('main.forgot_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email <input name="email" type="email" required autocomplete="email"></label>
    <button class="primary">Send reset link</button>
  </form>
  <p><a href="{{ url_for('main.login') }}">Back to log in</a></p>
</div>
{% endblock %}
