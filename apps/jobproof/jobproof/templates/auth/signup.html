{% extends "base.html" %}
{% block title %}Sign up – JobProof AI{% endblock %}
{% block container_class %}narrow{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Create your account</h1>
  <p class="muted">Free to try. No credit card needed.</p>
  <form method="post" action="{{ url_for('auth.signup') }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required value="{{ form.email }}" autofocus>
    <label for="password">Password <span class="hint">(at least 8 characters)</span></label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
    <label for="confirm_password">Confirm password</label>
    <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
    <button type="submit" class="btn btn-block">Create account</button>
  </form>
  <p class="muted center">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
