{% extends "base.html" %}
{% block title %}Log in – JobProof AI{% endblock %}
{% block container_class %}narrow{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>Log in</h1>
  <form method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email" required value="{{ form.email }}" autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" class="btn btn-block">Log in</button>
  </form>
  {% if mail_enabled %}<p class="muted center"><a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a></p>{% endif %}
  <p class="muted center">New here? <a href="{{ url_for('auth.signup') }}">Create an account</a></p>
</div>
{% endblock %}
