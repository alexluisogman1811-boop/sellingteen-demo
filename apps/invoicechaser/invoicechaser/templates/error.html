{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card narrow center">
  <p class="muted small">Error {{ code }}</p>
  <h1 class="center-title">{{ title }}</h1>
  <p>{{ message }}</p>
  <a class="btn btn-primary" href="{{ url_for('dashboard.home') }}">{{ 'Go to your dashboard' if g.user else 'Go to the home page' }}</a>
</div>
{% endblock %}
