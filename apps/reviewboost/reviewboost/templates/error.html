{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="card narrow center">
  <p class="error-code">{{ code }}</p>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  {% if g.business %}
  <a class="btn" href="{{ url_for('customers.dashboard') }}">Go to dashboard</a>
  {% else %}
  <a class="btn" href="{{ url_for('auth.login') }}">Go to log in</a>
  {% endif %}
</section>
{% endblock %}
